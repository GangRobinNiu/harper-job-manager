# REST interface for exported tables and resources
rest: true

# Tables
graphqlSchema:
  files: 'schema.graphql'

# Admin UI at /admin_ui/ (internal, read-only; reads the REST tables above)
static:
  files: 'admin_ui/**'
  urlPath: 'admin_ui'

# Custom endpoints: /trigger, /claim, /heartbeat, /complete
jsResource:
  files: 'resources.js'

# Harper's built-in scheduler runs this tick once per cluster (leader-elected).
# The tick does not run jobs. It only enqueues due cron jobs and reaps expired leases.
scheduler:
  jobs:
    - name: job-manager-tick
      interval: 5s
      handler: ./src/tick.js#tick
